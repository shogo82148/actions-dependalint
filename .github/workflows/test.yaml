name: Test
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write
jobs:
  test-check:
    name: runner / dependalint (github-check)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: info
          dependalint_flags: "testdata/dependabot.yaml"

  test-pr-check:
    if: github.event_name == 'pull_request'
    name: runner / dependalint (github-pr-check)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          level: warning
          dependalint_flags: "testdata/dependabot.yaml"

  test-pr-review:
    if: github.event_name == 'pull_request'
    name: runner / dependalint (github-pr-review)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        continue-on-error: true
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: error
          filter_mode: file
          fail_level: any
          dependalint_flags: "testdata/dependabot.yaml"
      - name: check the exit code
        if: ${{ !success() }}
        run: echo 'The previous step should fail' && exit 1

  test-sarif:
    name: runner / dependalint (sarif)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          reporter: sarif
          dependalint_flags: "testdata/dependabot.yaml"
